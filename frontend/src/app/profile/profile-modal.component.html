<div class="modal-overlay" (click)="onClose()">
    <div class="modal-container" (click)="$event.stopPropagation()">

        <div class="modal-header">
            <h2>My Profile</h2>
            <button class="close-btn" (click)="onClose()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body">
            <!-- Profile Header Section -->
            <div class="profile-header-section">
                <div class="avatar-large">
                    <img *ngIf="previewUrl || user?.profile_picture"
                        [src]="getProfileUrl(previewUrl || user.profile_picture)" alt="Profile">
                    <span *ngIf="!previewUrl && !user?.profile_picture" class="avatar-placeholder-large">
                        {{ getInitials(user?.full_name || user?.username) }}
                    </span>
                </div>

                <div class="photo-actions">
                    <button class="change-photo-btn" (click)="triggerFileInput()">
                        <i class="fas fa-camera"></i> Change
                    </button>
                    <button class="remove-photo-btn" *ngIf="previewUrl || user?.profile_picture"
                        (click)="onRemovePicture()" title="Remove Photo">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <input type="file" id="profileFileInput" hidden accept="image/*" (change)="onFileSelected($event)">

                <div class="user-identity">
                    <h3 class="user-display-name">{{ user?.full_name || user?.username }}</h3>
                    <span class="user-display-role">{{ user?.role }}</span>
                </div>
            </div>

            <!-- Form Fields -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" [class.form-control-plaintext]="!isEditing" [class.form-control]="isEditing"
                    [(ngModel)]="editData.email" [readonly]="!isEditing">
            </div>

            <div class="form-group">
                <label>Role</label>
                <input type="text" class="form-control-plaintext" [(ngModel)]="editData.role" readonly>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" [class.form-control-plaintext]="!isEditing" [class.form-control]="isEditing"
                    [(ngModel)]="editData.full_name" [readonly]="!isEditing">
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-secondary" *ngIf="isEditing" (click)="toggleEdit()">Cancel</button>
            <button class="btn-primary" *ngIf="!isEditing" (click)="toggleEdit()">
                <i class="fas fa-edit"></i> Edit Profile
            </button>
            <button class="btn-primary" *ngIf="isEditing" (click)="saveProfile()">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </div>
    </div>
</div>
